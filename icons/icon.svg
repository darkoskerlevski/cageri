<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6a11cb"/>
      <stop offset="100%" style="stop-color:#2575fc"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#grad)"/>
  <!-- Clock face -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="white" stroke-width="12" stroke-opacity="0.9"/>
  <!-- Hour marks -->
  <line x1="256" y1="82" x2="256" y2="108" stroke="white" stroke-width="10" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="256" y1="404" x2="256" y2="430" stroke="white" stroke-width="10" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="82" y1="256" x2="108" y2="256" stroke="white" stroke-width="10" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="404" y1="256" x2="430" y2="256" stroke="white" stroke-width="10" stroke-linecap="round" stroke-opacity="0.8"/>
  <!-- Hour hand pointing to 11 -->
  <line x1="256" y1="256" x2="192" y2="148" stroke="white" stroke-width="16" stroke-linecap="round"/>
  <!-- Minute hand pointing to 11 -->
  <line x1="256" y1="256" x2="320" y2="148" stroke="white" stroke-width="10" stroke-linecap="round" stroke-opacity="0.9"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="14" fill="white"/>
  <!-- Sparkle -->
  <text x="256" y="360" text-anchor="middle" font-size="56" font-family="sans-serif">✨</text>
</svg>
